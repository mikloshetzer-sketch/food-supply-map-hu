name: Build Supply Balance Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-supply-balance:
    runs-on: ubuntu-latest

    steps:
      - name: Repository letöltése
        uses: actions/checkout@v4

      - name: Python telepítése
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python csomagok telepítése
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl numpy

      - name: Supply balance adatbázis generálása
        run: |
          python tools/build_supply_balance.py

      - name: Eredmény ellenőrzése
        run: |
          ls -lah data/agriculture/
          head -n 5 data/agriculture/supply_balance_master.csv
          head -n 5 data/agriculture/supply_balance_unknown_rows.csv

      - name: Változások commitolása
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/agriculture/supply_balance_master.csv data/agriculture/supply_balance_unknown_rows.csv
          git diff --cached --quiet || git commit -m "Build supply balance database"
          git push
